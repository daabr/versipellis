name: Release

# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#release
# https://github.com/marketplace/actions/goreleaser-action#run-on-new-tag
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser
      packages: write # Docker
      # Attestation
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out unixODBC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lurcher/unixODBC
          ref: v2.3.14 # https://github.com/lurcher/unixODBC/releases
          path: unixODBC
      - name: Build release image
        run: docker build -t custom-goreleaser-cross -f Dockerfile.release .
      - name: Clean up unixODBC source
        run: rm -rf unixODBC

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":"$PWD" -w "$PWD" \
            custom-goreleaser-cross \
            release --clean

      - name: Generate attestation for binaries
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/versipellis_${{ github.ref_name }}_checksums.txt
      - name: Upload attestation as release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${ATTESTATION_BUNDLE}" "./dist/versipellis_${RELEASE_TAG}_attestation.sigstore.json"
          gh release upload --clobber "${RELEASE_TAG}" "./dist/versipellis_${RELEASE_TAG}_attestation.sigstore.json"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile.package
          context: .
          push: true
          sbom: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
