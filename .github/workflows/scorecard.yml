# https://github.com/marketplace/actions/ossf-scorecard-action
name: OpenSSF Scorecard supply-chain security

on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: '31 8 * * 1' # Every Monday at 08:31 UTC.
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # `publish_results: true` only works when run from the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      security-events: write # Upload results to code-scanning dashboard.
      id-token: write        # Publish results and get a badge (see publish_results below).

    steps:
      - name: Check out code
        uses: actions/checkout@v7 # https://github.com/marketplace/actions/checkout
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "write" PAT token. Uncomment the `repo_token` line below if
          # you want to enable the Branch-Protection check on a *public* repository.
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          # https://github.com/ossf/scorecard-action#publishing-results
          publish_results: true

          # (Optional) Uncomment file_mode if you have a .gitattributes with files marked export-ignore
          # file_mode: git

      - name: Upload artifact
        uses: actions/upload-artifact@v7 # https://github.com/marketplace/actions/upload-a-build-artifact
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # https://docs.github.com/en/code-security/how-tos/find-and-fix-code-vulnerabilities/integrate-with-existing-tools/upload-sarif-file
      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
