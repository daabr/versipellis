codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  round: nearest
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 5%
        informational: true

comment:
  layout: "header, diff, files"
  hide_project_coverage: false
